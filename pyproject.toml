[project]
name = "fastvlm-coreai"
version = "0.1.0"
description = "FastVLM to Core AI .aimodel conversion pipeline"
requires-python = ">=3.11"
dependencies = [
    "coreai-core==1.0.0b2",
    "coreai-torch==0.4.1",
    "coreai-opt==0.2.1",
    "torch==2.9.0",
    "safetensors",
    "huggingface-hub",
    "numpy",
    "timm",
    "transformers",
]

[tool.uv]
prerelease = "allow"

[tool.setuptools]
packages = []

[dependency-groups]
dev = []
